name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # deploy-pages が ときどき「No artifacts named github-pages」で失敗する (2026-11-24) → 少し待って 1 回だけやり直す
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        id: deployment2
